<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes AI Project Builder</title>
  <link rel="stylesheet" href="/static/projects.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f1419;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      flex-direction: row;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: #1a1f2e;
      border-right: 1px solid #2a3147;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 24px;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid #2a3147;
    }

    .sidebar-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #4a9eff, #3b82f6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn {
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: #a0a0a0;
      cursor: pointer;
      border-radius: 8px;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn:hover {
      background: #252d3d;
      color: #e0e0e0;
    }

    .nav-btn.active {
      background: #3b82f6;
      color: #fff;
    }

    .sidebar-spacer {
      flex: 1;
    }

    .model-status {
      padding: 16px;
      background: #252d3d;
      border-radius: 12px;
      text-align: center;
      border-top: 1px solid #2a3147;
      padding-top: 16px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .model-status.loading .status-dot,
    .model-status.fallback .status-dot {
      background: #f59e0b;
    }

    .model-status.error .status-dot {
      background: #ef4444;
      animation: none;
    }

    #modelStatusText {
      font-size: 11px;
      color: #10b981;
    }

    .model-status.loading #modelStatusText,
    .model-status.fallback #modelStatusText {
      color: #f59e0b;
    }

    .model-status.error #modelStatusText {
      color: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .model-name {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 4px;
    }

    .model-label {
      font-size: 12px;
      color: #a0a0a0;
    }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f1419;
    }

    .header {
      background: #1a1f2e;
      border-bottom: 1px solid #2a3147;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .header-subtitle {
      font-size: 12px;
      color: #a0a0a0;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #252d3d;
      border-radius: 12px;
      font-size: 11px;
      color: #10b981;
      font-weight: 500;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* SECTIONS */
    .section {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .section.active {
      display: flex;
    }

    /* CHAT SECTION */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 24px;
      color: #a0a0a0;
    }

    .chat-empty-title {
      font-size: 18px;
      font-weight: 500;
      color: #e0e0e0;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      max-width: 600px;
    }

    .suggestion-btn {
      padding: 12px 16px;
      background: #252d3d;
      border: 1px solid #3a4454;
      border-radius: 12px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
      text-align: left;
    }

    .suggestion-btn:hover {
      background: #2a3447;
      border-color: #4a9eff;
      color: #4a9eff;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar,
    .message.loading .message-avatar {
      background: linear-gradient(135deg, #4a9eff, #3b82f6);
      color: #fff;
    }

    .message.user .message-avatar {
      background: #3a4454;
      color: #4a9eff;
    }

    .message-bubble {
      max-width: 600px;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message-content {
      max-width: 600px;
    }

    .message-content .message-bubble {
      max-width: 100%;
    }

    .message-metadata {
      margin-top: 6px;
      padding-left: 4px;
      color: #7a8595;
      font-size: 10px;
      letter-spacing: 0.02em;
    }

    .message.loading .message-bubble {
      color: #a0a0a0;
      font-style: italic;
    }

    .message.assistant .message-bubble,
    .message.loading .message-bubble {
      background: #1e2a36;
      border: 1px solid #2a3547;
      color: #e0e0e0;
    }

    .message.user .message-bubble {
      background: #3b82f6;
      color: #fff;
    }

    .message.error .message-bubble {
      background: #7f1d1d;
      border-color: #dc2626;
      color: #fecaca;
    }

    .section-error {
      padding: 12px 16px;
      background: #7f1d1d;
      border: 1px solid #dc2626;
      border-radius: 8px;
      color: #fecaca;
    }

    .chat-input-area {
      padding: 24px 32px;
      background: #0f1419;
      border-top: 1px solid #2a3147;
      display: flex;
      gap: 12px;
    }

    .input-container {
      flex: 1;
      display: flex;
      gap: 12px;
    }

    #message {
      flex: 1;
      padding: 12px 16px;
      background: #1e2a36;
      border: 1px solid #2a3547;
      color: #e0e0e0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      max-height: 120px;
      outline: none;
      transition: all 0.2s ease;
    }

    #message:focus {
      border-color: #3b82f6;
      background: #252d3d;
    }

    #message::placeholder {
      color: #7a8595;
    }

    .send-btn {
      padding: 12px 24px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }

    .send-btn:hover:not(:disabled) {
      background: #2563eb;
    }

    .send-btn:disabled {
      background: #5a6b82;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TASKS SECTION */
    .tasks-container {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .add-task-form {
      display: flex;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2a3147;
    }

    #taskInput {
      flex: 1;
      padding: 12px 16px;
      background: #1e2a36;
      border: 1px solid #2a3547;
      color: #e0e0e0;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    #taskInput:focus {
      border-color: #3b82f6;
    }

    .add-task-btn {
      padding: 12px 24px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .add-task-btn:hover {
      background: #059669;
    }

    .tasks-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .task-card {
      background: #1e2a36;
      border: 1px solid #2a3547;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .task-card:hover {
      border-color: #3a4454;
      background: #252d3d;
    }

    .task-card.completed {
      opacity: 0.6;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: #7a8595;
    }

    .task-title {
      font-weight: 500;
      color: #e0e0e0;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .task-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .task-done-btn {
      background: #10b981;
      color: #fff;
    }

    .task-done-btn:hover {
      background: #059669;
    }

    .task-delete-btn {
      background: #ef4444;
      color: #fff;
    }

    .task-delete-btn:hover {
      background: #dc2626;
    }

    .task-undo-btn {
      background: #a0a0a0;
      color: #fff;
    }

    .task-undo-btn:hover {
      background: #8a8a8a;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #7a8595;
      text-align: center;
    }

    /* NOTES SECTION */
    .notes-container {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .add-note-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2a3147;
    }

    #noteTitle, #noteContent {
      padding: 12px 16px;
      background: #1e2a36;
      border: 1px solid #2a3547;
      color: #e0e0e0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    #noteTitle:focus, #noteContent:focus {
      border-color: #3b82f6;
    }

    #noteTitle {
      font-weight: 500;
      font-size: 15px;
    }

    #noteContent {
      resize: vertical;
      min-height: 80px;
      max-height: 150px;
    }

    .add-note-btn {
      align-self: flex-start;
      padding: 12px 24px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .add-note-btn:hover {
      background: #059669;
    }

    .notes-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .note-card {
      background: #1e2a36;
      border: 1px solid #2a3547;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .note-card:hover {
      border-color: #3a4454;
      background: #252d3d;
    }

    .note-title {
      font-weight: 600;
      color: #e0e0e0;
      font-size: 14px;
    }

    .note-content {
      font-size: 13px;
      color: #a0a0a0;
      line-height: 1.5;
      max-height: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .note-delete-btn {
      padding: 8px 12px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
      margin-top: auto;
    }

    .note-delete-btn:hover {
      background: #dc2626;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #3a4454;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4a5568;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 12px;
        gap: 12px;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #2a3147;
      }

      .sidebar-header {
        border-bottom: none;
        padding-bottom: 0;
      }

      .nav-menu {
        flex-direction: row;
        order: 3;
        width: 100%;
      }

      .nav-btn {
        flex: 1;
        justify-content: center;
      }

      .sidebar-spacer {
        display: none;
      }

      .model-status {
        border-top: none;
        padding-top: 0;
        border-left: 1px solid #2a3147;
        padding-left: 12px;
        margin-left: auto;
      }

      .chat-messages, .tasks-container, .notes-container {
        padding: 16px;
      }

      .chat-input-area {
        padding: 16px;
      }

      .suggestions {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }

      .message-bubble {
        max-width: 100%;
      }

      .tasks-list, .notes-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-icon">🤖</div>
        <div class="sidebar-title">Hermes AI</div>
      </div>

      <div class="nav-menu">
        <button class="nav-btn active" data-tab="chat">
          <span>💬</span> Chat
        </button>
        <button class="nav-btn" data-tab="projects"><span aria-hidden="true">&#9638;</span> Projects</button>
        <button class="nav-btn" data-tab="tasks">
          <span>✓</span> Tasks
        </button>
        <button class="nav-btn" data-tab="notes">
          <span>📝</span> Notes
        </button>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="model-status">
        <div class="status-indicator">
          <div class="status-dot"></div>
          <span id="modelStatusText">Online</span>
        </div>
        <div class="model-name" id="modelName">Hermes Agent</div>
        <div class="model-label" id="modelLabel">Multi-Model Router</div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div class="header">
        <div>
          <div class="header-title">Hermes AI Project Builder</div>
          <div class="header-subtitle">Powered by Hermes Agent • Multi-Model AI</div>
        </div>
        <div class="badge">Hermes • Multi-Model</div>
      </div>

      <div class="content-area">
        <!-- CHAT SECTION -->
        <div class="section active" data-section="chat">
          <div class="chat-messages" id="chat"></div>
          <div class="chat-input-area">
            <div class="input-container">
              <textarea id="message" placeholder="Ask Hermes anything..." rows="1"></textarea>
              <button class="send-btn" id="send">
                <span id="sendIcon">↗</span>
              </button>
            </div>
          </div>
        </div>

        <div class="section" data-section="projects">
          <div class="projects-container">
            <h2>Hermes Autonomous Coding Agent</h2>
            <p>Create a project, or open an existing website to validate, repair and monitor its agent runs.</p>
            <form id="projectForm">
              <label for="projectPrompt">Project description</label>
              <textarea id="projectPrompt" required maxlength="12000" placeholder="Create a responsive website for a travel agency..."></textarea>
              <button id="buildProject" type="submit">Build Project</button>
            </form>
            <p id="projectStatus" role="status" aria-live="polite"></p>
            <div id="projectResult"></div>
            <h3>Project history</h3>
            <div id="projectHistory"></div>
          </div>
        </div>
        <!-- TASKS SECTION -->
        <div class="section" data-section="tasks">
          <div class="tasks-container">
            <div class="add-task-form">
              <input type="text" id="taskInput" placeholder="What do you need to do?">
              <button class="add-task-btn">Add Task</button>
            </div>
            <div class="tasks-list" id="tasks"></div>
          </div>
        </div>

        <!-- NOTES SECTION -->
        <div class="section" data-section="notes">
          <div class="notes-container">
            <div class="add-note-form">
              <input type="text" id="noteTitle" placeholder="Note title...">
              <textarea id="noteContent" placeholder="Note content..."></textarea>
              <button class="add-note-btn">Add Note</button>
            </div>
            <div class="notes-list" id="notes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isLoading = false;
    let conversations = [];

    // TAB SWITCHING
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelector(`[data-section="${tab}"]`).classList.add('active');

        if (tab === 'tasks') loadTasks();
        if (tab === 'notes') loadNotes();
      });
    });

    // CHAT FUNCTIONALITY
    const modelDisplayNames = {
      'mimo-v2.5-free': 'MiMo V2.5',
      'gpt-5.6-sol': 'GPT-5.6 Sol',
      'llama3.2:3b': 'Llama 3.2 3B'
    };

    const providerDisplayNames = {
      'opencode-free': 'OpenCode',
      'openai-codex': 'OpenAI Codex',
      'ollama': 'Ollama'
    };

    function cleanDisplayName(value, names, fallback) {
      if (!value || typeof value !== 'string') return fallback;
      return names[value.toLowerCase()] || fallback;
    }

    function taskDisplayName(taskType) {
      if (taskType === 'coding') return 'Coding';
      if (taskType === 'reasoning') return 'Reasoning';
      return 'General';
    }

    function setModelStatus(status, model, label, state = '') {
      const card = document.querySelector('.model-status');
      card.classList.remove('loading', 'fallback', 'error');
      if (state) card.classList.add(state);
      document.getElementById('modelStatusText').textContent = status;
      document.getElementById('modelName').textContent = model;
      document.getElementById('modelLabel').textContent = label;
    }

    function updateModelStatus(data) {
      const model = cleanDisplayName(data.model, modelDisplayNames, 'Selected Model');
      const provider = cleanDisplayName(data.provider, providerDisplayNames, 'AI Provider');

      if (data.provider === 'ollama') {
        setModelStatus('Online', model, `Local • ${provider}`);
      } else if (data.fallback_used) {
        setModelStatus('Fallback Active', model, 'MiMo → GPT-5.6 Sol', 'fallback');
      } else {
        setModelStatus('Online', model, `${taskDisplayName(data.task_type)} • ${provider}`);
      }
    }

    function responseMetadata(data) {
      const parts = [
        taskDisplayName(data.task_type),
        cleanDisplayName(data.model, modelDisplayNames, 'Selected Model'),
        cleanDisplayName(data.provider, providerDisplayNames, 'AI Provider')
      ];
      if (data.fallback_used) parts.push('Fallback');
      return parts.join(' • ');
    }

    async function sendMessage() {
      const message = document.getElementById('message').value.trim();
      if (!message || isLoading) return;

      isLoading = true;
      document.getElementById('send').disabled = true;
      document.getElementById('sendIcon').innerHTML = '<span class="loading-spinner"></span>';

      appendMessage('user', message);
      const loadingMessage = appendMessage('loading', 'Hermes is selecting the best model...');
      setModelStatus('Selecting Model', 'Hermes Agent', 'Choosing the best model...', 'loading');
      document.getElementById('message').value = '';
      autoResizeTextarea();

      try {
        const res = await fetch('/api/converse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error('Unable to reach the AI service. Please try again.');
        }

        if (typeof data.reply !== 'string' || !data.reply.trim()) {
          throw new Error('The assistant returned an empty reply.');
        }

        loadingMessage.remove();
        appendMessage('assistant', data.reply, responseMetadata(data));
        updateModelStatus(data);
      } catch (error) {
        loadingMessage.remove();
        appendMessage('error', 'Unable to contact the assistant. Please try again.');
        setModelStatus('Connection Error', 'Hermes Agent', '', 'error');
      } finally {
        isLoading = false;
        document.getElementById('send').disabled = false;
        document.getElementById('sendIcon').innerHTML = '↗';
      }
    }

    function appendMessage(type, text, metadata = '') {
      const chatDiv = document.getElementById('chat');

      if (chatDiv.querySelector('.chat-empty')) {
        chatDiv.innerHTML = '';
      }

      const messageEl = document.createElement('div');
      messageEl.className = `message ${type}`;

      const avatars = { user: '👤', assistant: '🤖', loading: '🤖', error: '⚠️' };
      const avatar = avatars[type] || type[0].toUpperCase();

      messageEl.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
          <div class="message-bubble">${escapeHtml(text)}</div>
          ${type === 'assistant' && metadata ? `<div class="message-metadata">${escapeHtml(metadata)}</div>` : ''}
        </div>
      `;

      chatDiv.appendChild(messageEl);
      chatDiv.scrollTop = chatDiv.scrollHeight;
      return messageEl;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function autoResizeTextarea() {
      const textarea = document.getElementById('message');
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    async function requireOk(res, fallbackMessage) {
      if (res.ok) return res;

      let detail = '';
      try {
        const data = await res.json();
        detail = data.detail || '';
      } catch (_) {}
      throw new Error(detail || `${fallbackMessage} (${res.status})`);
    }

    function showSectionError(containerId, message) {
      document.getElementById(containerId).innerHTML =
        `<div class="section-error" role="alert">${escapeHtml(message)}</div>`;
    }

    // TASKS
    async function loadTasks() {
      try {
        const res = await requireOk(await fetch('/api/tasks'), 'Unable to load tasks');
        const tasks = await res.json();
        const tasksDiv = document.getElementById('tasks');

        if (tasks.length === 0) {
          tasksDiv.innerHTML = '<div class="empty-state">No tasks yet. Add one to get started!</div>';
          return;
        }

        tasksDiv.innerHTML = tasks.map(t => `
          <div class="task-card ${t.done ? 'completed' : ''}">
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-actions">
              <button class="task-btn ${t.done ? 'task-undo-btn' : 'task-done-btn'}" onclick="updateTask(${t.id}, ${!t.done})">
                ${t.done ? '↶ Undo' : '✓ Done'}
              </button>
              <button class="task-btn task-delete-btn" onclick="deleteTask(${t.id})">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load tasks:', error);
        showSectionError('tasks', error.message || 'Unable to load tasks.');
      }
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      if (!title) return;

      try {
        const res = await requireOk(await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        }), 'Unable to add task');
        input.value = '';
        await loadTasks();
      } catch (error) {
        console.error('Failed to add task:', error);
        showSectionError('tasks', error.message || 'Unable to add task.');
      }
    }

    async function updateTask(id, done) {
      try {
        await requireOk(await fetch(`/api/tasks/${id}/done`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done })
        }), 'Unable to update task');
        await loadTasks();
      } catch (error) {
        console.error('Failed to update task:', error);
        showSectionError('tasks', error.message || 'Unable to update task.');
      }
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      try {
        await requireOk(await fetch(`/api/tasks/${id}`, { method: 'DELETE' }), 'Unable to delete task');
        await loadTasks();
      } catch (error) {
        console.error('Failed to delete task:', error);
        showSectionError('tasks', error.message || 'Unable to delete task.');
      }
    }

    // NOTES
    async function loadNotes() {
      try {
        const res = await requireOk(await fetch('/api/notes'), 'Unable to load notes');
        const notes = await res.json();
        const notesDiv = document.getElementById('notes');

        if (notes.length === 0) {
          notesDiv.innerHTML = '<div class="empty-state">No notes yet. Create one to get started!</div>';
          return;
        }

        notesDiv.innerHTML = notes.map(n => `
          <div class="note-card">
            <div class="note-title">${escapeHtml(n.title)}</div>
            <div class="note-content">${escapeHtml(n.content || '')}</div>
            <button class="note-delete-btn" onclick="deleteNote(${n.id})">Delete Note</button>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load notes:', error);
        showSectionError('notes', error.message || 'Unable to load notes.');
      }
    }

    async function addNote() {
      const title = document.getElementById('noteTitle').value.trim();
      const content = document.getElementById('noteContent').value.trim();

      if (!title) return;

      try {
        const res = await requireOk(await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        }), 'Unable to add note');
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        await loadNotes();
      } catch (error) {
        console.error('Failed to add note:', error);
        showSectionError('notes', error.message || 'Unable to add note.');
      }
    }

    async function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      try {
        await requireOk(await fetch(`/api/notes/${id}`, { method: 'DELETE' }), 'Unable to delete note');
        await loadNotes();
      } catch (error) {
        console.error('Failed to delete note:', error);
        showSectionError('notes', error.message || 'Unable to delete note.');
      }
    }

    // EVENTS
    document.getElementById('send').addEventListener('click', sendMessage);
    document.getElementById('message').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('message').addEventListener('input', autoResizeTextarea);
    document.querySelector('.add-task-btn').addEventListener('click', addTask);
    document.getElementById('taskInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    document.querySelector('.add-note-btn').addEventListener('click', addNote);

    // INITIAL LOAD
    window.addEventListener('load', () => {
      const chatDiv = document.getElementById('chat');
      chatDiv.innerHTML = `
        <div class="chat-empty">
          <div class="chat-empty-title">How can I help you today?</div>
          <div class="suggestions">
            <button class="suggestion-btn" onclick="document.getElementById('message').value='Summarize my notes'; document.getElementById('send').click();">Summarize my notes</button>
            <button class="suggestion-btn" onclick="document.getElementById('message').value='Help me plan my day'; document.getElementById('send').click();">Help me plan my day</button>
            <button class="suggestion-btn" onclick="document.getElementById('message').value='Create a task'; document.getElementById('send').click();">Create a task</button>
            <button class="suggestion-btn" onclick="document.getElementById('message').value='Explain this concept'; document.getElementById('send').click();">Explain a concept</button>
          </div>
        </div>
      `;
    });
  </script>
  <script src="/static/project-runs.js"></script>
  <script src="/static/project-publications.js"></script>
  <script src="/static/projects.js"></script>
</body>
</html>
