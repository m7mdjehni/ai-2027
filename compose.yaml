services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-hermes}
      - HERMES_ROUTER_URL=${HERMES_ROUTER_URL:-http://host.docker.internal:8765}
      - HERMES_ROUTER_TIMEOUT=${HERMES_ROUTER_TIMEOUT:-620}
      - PROJECT_BUILDER_TOKEN=${PROJECT_BUILDER_TOKEN:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./app:/app/app
      - ./generated_projects:/app/generated_projects:ro
    restart: on-failure

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - "~/.hermes:/opt/data"
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
      # Optional OpenAI-compatible API:
      # - API_SERVER_ENABLED=1
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY should never be committed; use an environment variable or secret configuration.

volumes:
  pgdata:
